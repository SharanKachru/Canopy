name: Build and deploy container to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Hash the secret
        run: |
          echo -n "${{ secrets.ACR_PASSWORD }}" | sha256sum
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

      - name: Log in to Docker registry
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login canopy.azurecr.io -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t canopy.azurecr.io/canopy:latest .
          docker push canopy.azurecr.io/canopy:latest

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: Canopy
          images: canopy.azurecr.io/canopy:latest
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
