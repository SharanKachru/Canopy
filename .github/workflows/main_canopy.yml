name: Build and deploy container to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug secret length
        run: |
          echo "Username length: ${#ACR_USERNAME}"
          echo "Password length: ${#ACR_PASSWORD}"
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          
      - name: Test raw auth from GitHub runner
        run: |
          curl -u "${{ secrets.ACR_USERNAME }}:${{ secrets.ACR_PASSWORD }}" https://canopy.azurecr.io/v2/_catalog -v  

      - name: Log in to Docker registry
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login canopy.azurecr.io -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t canopy.azurecr.io/canopy:latest .
          docker push canopy.azurecr.io/canopy:latest

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: Canopy
          images: canopy.azurecr.io/canopy:latest
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
