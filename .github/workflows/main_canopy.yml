name: Build and deploy container to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker registry
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          test -n "$ACR_USERNAME" || (echo "Missing GitHub secret: ACR_USERNAME" && exit 1)
          test -n "$ACR_PASSWORD" || (echo "Missing GitHub secret: ACR_PASSWORD" && exit 1)
          echo "$ACR_PASSWORD" | docker login canopy.azurecr.io -u "$ACR_USERNAME" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t canopy.azurecr.io/canopy:latest .
          docker push canopy.azurecr.io/canopy:latest

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: Canopy
          images: canopy.azurecr.io/canopy:latest
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
